### NOTE
# This is base packages for the project environment.
# For full development environment, also install env-dev.yml.

name: nbm
channels:
  - pytorch
  - nvidia
  - defaults
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - pandas
  - matplotlib
  - seaborn
  - scikit-learn
  - pytorch-cuda
  - pytorch=2.5.1=*cuda*
  - h5py
  - ignite
  - pip:
    - -e .